<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vota · IDEAᴵᴬ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400;1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
/* Il telecomando di voto dei corsisti: una colonna sul cielo notturno, la domanda della LIM e grandi pulsanti pergamena. Nessun account: si entra con il codice della sala (nel QR). */
:root{
  --bg:#17142C; --panel:rgba(38,30,64,.82); --ink:#F3EAF0; --muted:#B9A9C4; --line:#3B3056;
  --paper:#F7F1EE; --paper-ink:#2A2045;
  --blu:#9EA6E2; --rosso:#EA9B8C; --giallo:#F2B97F; --verde:#88C0AF; --lilla:#C8A5D8; --glow:#F6D58E;
  --blu-d:#404894; --rosso-d:#A3493C; --giallo-d:#8A5217; --verde-d:#2A6858; --lilla-d:#6B4A85;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:linear-gradient(to bottom,#14122A 0%,#1F1A3C 40%,#35284F 70%,#5C3760 100%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-block:max(18px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--giallo);outline-offset:3px}
.c-blu{--suit:var(--blu);--suit-d:var(--blu-d)}.c-rosso{--suit:var(--rosso);--suit-d:var(--rosso-d)}.c-giallo{--suit:var(--giallo);--suit-d:var(--giallo-d)}.c-verde{--suit:var(--verde);--suit-d:var(--verde-d)}.c-lilla{--suit:var(--lilla);--suit-d:var(--lilla-d)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:-.02em}
.logo sup{font-size:.45em;color:var(--rosso)}
.st{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.st .dot{width:10px;height:10px;border-radius:50%;background:#7D6F92}
.st.live .dot{background:#7FD49B;box-shadow:0 0 10px #7FD49B}
h1{font-family:var(--f-serif);font-weight:650;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:6vh}
.wait p{color:var(--muted);margin:0;max-width:340px}
.mascot{width:170px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper);color:var(--paper-ink);border:0;border-radius:18px;padding:16px 18px;font-family:var(--f-serif);font-weight:650;font-size:21px;line-height:1.2;box-shadow:0 5px 0 var(--suit-d)}
.opt::before{content:"";flex:none;width:22px;height:22px;border-radius:50%;border:3px solid var(--suit-d)}
.opt.sel{box-shadow:0 0 0 4px var(--glow),0 5px 0 var(--suit-d)}
.opt.sel::before{background:var(--suit-d)}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--suit-d)}
.note{font-size:16px;color:var(--muted);margin:0}
.draft{border-radius:6px;padding:14px 14px 10px;background:var(--pc,#FBE8A6);color:#3A2E1A;box-shadow:0 14px 26px -16px #000;transform:rotate(-1deg)}
.draft label{display:block;font-family:var(--f-serif);font-style:italic;font-size:18px}
.draft textarea{display:block;width:100%;min-height:110px;margin-top:6px;background:transparent;border:0;border-bottom:2px dashed rgba(58,46,26,.3);resize:vertical;font-family:var(--f-serif);font-size:20px;line-height:1.35;color:#3A2E1A}
.draft textarea:focus{outline:none;border-bottom-color:rgba(58,46,26,.7)}
.who{width:100%;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:12px;padding:11px 12px;font-size:17px;color:var(--ink)}
.colors{display:flex;gap:10px}
.colors button{width:40px;height:40px;border-radius:10px;border:3px solid transparent;background:var(--c)}
.colors button[aria-pressed="true"]{border-color:var(--glow);box-shadow:0 0 14px -2px var(--glow)}
.mine{display:grid;gap:10px}
.pn{position:relative;border-radius:6px;padding:12px 40px 12px 14px;background:var(--pc);color:#3A2E1A;font-family:var(--f-serif);font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.pn button{position:absolute;right:6px;top:4px;border:0;background:none;font-size:24px;line-height:1;color:#3A2E1A;opacity:.6;padding:4px}
.k-giallo{--pc:#FBE8A6}.k-rosa{--pc:#F6C9C0}.k-azzurro{--pc:#C9D2F2}.k-verde{--pc:#C6E3D8}
.res{display:grid;gap:8px}
.res div{display:grid;grid-template-columns:minmax(0,1fr) 34px;gap:4px 10px;font-size:15px;color:var(--muted)}
.res i{grid-column:1/-1;display:block;height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden}
.res i b{display:block;height:100%;background:var(--suit);transition:width .6s}
.res span:last-of-type{text-align:right;font-weight:700}
.btn{display:inline-block;border:0;border-radius:16px;padding:14px 22px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;background:var(--giallo);color:var(--paper-ink);box-shadow:0 5px 0 var(--giallo-d);text-decoration:none}
.code{display:flex;gap:10px}
.code input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:22px;letter-spacing:.2em;text-transform:lowercase}
.code input:focus{border-color:var(--giallo);outline:none}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:18px}
@media (prefers-reduced-motion: reduce){.res i b{transition:none}.opt:active{transform:none}}

/* logo Wolf Team, nei colori del corso */
.wt{display:inline-flex;align-items:center;gap:.5em;font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;vertical-align:middle;line-height:1;font-style:normal}
.wt .wt-m{width:2.1em;height:2.1em;flex:none;display:block}
.wt-w b{font-weight:800;color:var(--wt-accent,#F2B97F)}
</style>

<div class="wrap">
  <div class="top"><span class="logo">IDEA<sup>IA</sup></span><span class="st" id="st"><span class="dot"></span><span id="sttxt">Collegamento…</span></span></div>
  <main id="body" aria-live="polite"></main>
  <footer>Il voto è anonimo e non serve nessun account.<br><span style="display:inline-block;margin-top:10px"><span class="wt"><svg class="wt-m" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="93" style="fill:#ABA3DC;stroke:#F6D58E;stroke-width:7"/><circle cx="100" cy="100" r="84" style="fill:none;stroke:#F7F1EE;stroke-opacity:.28;stroke-width:2"/><path d="M53 40.9 74.8 64.3 49.7 72.7Z" style="fill:#F7F1EE"/><path d="M146.9 40.9 125.2 64.3 150.3 72.7Z" style="fill:#F7F1EE"/><path d="M100 57.6 116.8 62.6 160.3 89.4 180.5 116.1 133.5 143.1 100 176.6Z" style="fill:#F7F1EE;opacity:.5"/><path d="M61.5 96.2 88.2 101.2 76.5 109.5Z" style="fill:#17142C"/><path d="M138.5 96.2 111.8 101.2 123.5 109.5Z" style="fill:#17142C"/><path d="M88.2 153.1 111.8 153.1 100 168.1Z" style="fill:#17142C"/></svg><span class="wt-w">Wolf <b>Team</b></span></span></span></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const BROKERS=["wss://broker.hivemq.com:8884/mqtt","wss://broker.emqx.io:8084/mqtt"];
const ALFA="abcdefghjkmnpqrstuvwxyz23456789";
const rnd=n=>Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>ALFA[b%31]).join("");
const okForm=u=>/^https:\/\/(docs\.google\.com\/forms\/|forms\.gle\/)/.test(u||"");
const SUIT=["blu","rosso","giallo","verde","lilla"];
let ME=store.get("voto-io","");if(!/^[a-z0-9]{10}$/.test(ME)){ME=rnd(10);store.set("voto-io",ME)}
let SALA=(location.hash.slice(1)||"").toLowerCase();
let POLL=null,CLIENTS=[];

const MASCOT=`<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="82" r="36" style="fill:#F6D58E;opacity:.2"/><ellipse cx="38" cy="54" rx="20" ry="10" transform="rotate(-28 38 54)" style="fill:#C8A5D8;opacity:.6"/><ellipse cx="82" cy="54" rx="20" ry="10" transform="rotate(28 82 54)" style="fill:#C8A5D8;opacity:.6"/><ellipse cx="60" cy="81" rx="18" ry="22" style="fill:#F6D58E"/><path d="M44 76h32M45 86h30" style="stroke:#E2B866;stroke-width:2.2"/><ellipse cx="60" cy="59" rx="16" ry="11" style="fill:#4A3560"/><path d="M52 25Q46 11 37 9M68 25Q74 11 83 9" style="fill:none;stroke:#F3EAF0;stroke-width:3;stroke-linecap:round;opacity:.85"/><circle cx="37" cy="9" r="3.6" style="fill:#F2B97F"/><circle cx="83" cy="9" r="3.6" style="fill:#F2B97F"/><circle cx="60" cy="38" r="17.5" style="fill:#2A2045"/><circle cx="53" cy="35.5" r="5.6" style="fill:#fff"/><circle cx="67" cy="35.5" r="5.6" style="fill:#fff"/><circle cx="54.2" cy="36.6" r="2.7" style="fill:#17142C"/><circle cx="68.2" cy="36.6" r="2.7" style="fill:#17142C"/><circle cx="46.5" cy="43" r="3" style="fill:#EA9B8C;opacity:.7"/><circle cx="73.5" cy="43" r="3" style="fill:#EA9B8C;opacity:.7"/><path d="M52.5 44Q60 51.5 67.5 44" style="fill:none;stroke:#F3EAF0;stroke-width:2.4;stroke-linecap:round"/></svg>`;

const base=()=>`ideaia/v1/${SALA}`;
const live=()=>CLIENTS.filter(c=>c.connected);
const pub=(t,p)=>live().forEach(c=>{try{c.publish(t,p,{retain:true,qos:0})}catch(e){}});
const vkey=()=>`voto-${SALA}-${POLL.id}-${POLL.r}`;
const myVote=()=>store.get(vkey(),null);

function status(){const n=live().length;$("st").classList.toggle("live",n>0);$("sttxt").textContent=!SALA?"Nessuna sala":n?`Sala ${SALA}`:"Collegamento…"}

function render(){
  if(!/^[a-z0-9]{6}$/.test(SALA)){
    $("body").innerHTML=`<div class="wait"><div class="mascot">${MASCOT}</div><h1>Entrate nella sala</h1><p>Inquadrate il QR sulla LIM, oppure scrivete il codice della sala che vedete sotto le barre.</p>
      <form class="code" id="codef" style="margin-top:10px;width:100%"><input id="codein" maxlength="6" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Codice della sala" placeholder="codice"><button class="btn" type="submit">Entra</button></form></div>`;
    $("codef").onsubmit=e=>{e.preventDefault();const v=$("codein").value.trim().toLowerCase();if(/^[a-z0-9]{6}$/.test(v)){location.hash=v}};
    return}
  if(POLL&&!POLL.id&&POLL.board){renderBoard();return}
  if(!POLL||(!POLL.id&&!POLL.form)){
    $("body").innerHTML=`<div class="wait"><div class="mascot">${MASCOT}</div><h1>Aspettate la prossima domanda</h1><p>Quando sulla LIM compare un sondaggio, qui arrivano i pulsanti per votare. Tenete aperta questa pagina.</p></div>`;return}
  if(!POLL.id){
    $("body").innerHTML=`<div class="wait"><div class="mascot">${MASCOT}</div><h1>Il questionario finale</h1><p>Anonimo, cinque minuti. Grazie!</p><a class="btn" style="margin-top:8px" href="${esc(POLL.form)}" target="_blank" rel="noopener">Apri il questionario</a></div>`;return}
  const mine=myVote(),tot=POLL.c.reduce((a,b)=>a+b,0),max=Math.max(1,...POLL.c);
  $("body").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px"><h1>${esc(POLL.q)}</h1>
    ${POLL.o.map((t,i)=>`<button class="opt c-${SUIT[i%5]} ${mine===i?"sel":""}" data-v="${i}" aria-pressed="${mine===i}">${esc(t)}</button>`).join("")}
    ${mine==null?`<p class="note">Toccate una risposta: potete cambiarla finché la domanda resta sulla LIM.</p>`
    :`<p class="note">Voto inviato. Ecco la sala${tot?` (${tot} ${tot===1?"voto":"voti"})`:""}:</p><div class="res">${POLL.o.map((t,i)=>`<div class="c-${SUIT[i%5]}"><span>${esc(t)}</span><span>${POLL.c[i]||0}</span><i><b style="width:${(POLL.c[i]||0)/max*100}%"></b></i></div>`).join("")}</div>`}</div>`;
}
$("body").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(!b||!POLL||!POLL.id)return;
  const c=+b.dataset.v;store.set(vkey(),c);pub(`${base()}/v/${POLL.id}/${ME}`,JSON.stringify({c}));render()});

/* la bacheca del diario dei bisogni: un post-it per bisogno, si possono togliere i propri */
const COLORI=["giallo","rosa","azzurro","verde"];
let COLORE=store.get("bacheca-colore","giallo");if(!COLORI.includes(COLORE))COLORE="giallo";
const mieiKey=()=>`bacheca-${SALA}`;
function renderBoard(){const miei=store.get(mieiKey(),[]);
  $("body").innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">
    <h1>La bacheca dei bisogni</h1><p class="note">Ricopiate dal foglio i bisogni con la stella: uno per post-it. Compaiono subito sulla LIM.</p>
    <form id="pf" style="display:flex;flex-direction:column;gap:12px">
      <div class="draft k-${COLORE}" id="draft"><label for="pt">Mi servirebbe qualcosa che…</label><textarea id="pt" maxlength="280" placeholder="…faccia sentire il ritmo a chi non riesce a seguirlo."></textarea></div>
      <div class="colors" role="group" aria-label="Colore del post-it">${COLORI.map(c=>`<button type="button" class="k-${c}" data-col="${c}" style="--c:var(--pc)" aria-label="${c}" aria-pressed="${c===COLORE}"></button>`).join("")}</div>
      <input class="who" id="pa" maxlength="40" placeholder="Il vostro nome (facoltativo)" autocomplete="given-name" value="${esc(store.get("bacheca-nome",""))}">
      <button class="btn" type="submit" id="ps" disabled>Attacca il post-it</button>
      <p class="note" id="pm">Niente nomi di alunni: si descrivono i bisogni, non le persone.</p>
    </form>
    ${miei.length?`<h2 style="font-family:var(--f-serif);font-weight:500;font-size:22px;margin:6px 0 0">I vostri post-it</h2><div class="mine">${miei.map(p=>`<div class="pn k-${COLORI.includes(p.c)?p.c:"giallo"}">…${esc(p.t)}<button type="button" data-rm="${esc(p.id)}" aria-label="Togli questo post-it">×</button></div>`).join("")}</div>`:""}
  </div>`;
  const ta=$("pt");ta.addEventListener("input",()=>{$("ps").disabled=ta.value.trim().length<2});
  document.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{COLORE=b.dataset.col;store.set("bacheca-colore",COLORE);$("draft").className="draft k-"+COLORE;document.querySelectorAll("[data-col]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("pf").onsubmit=e=>{e.preventDefault();const t=ta.value.trim().replace(/^…\s*/,"");if(t.length<2)return;
    if(!live().length){$("pm").textContent="Non siete collegati alla sala: controllate la connessione e riprovate.";return}
    const a=$("pa").value.trim();store.set("bacheca-nome",a);const id=`${ME}-${rnd(5)}`;
    pub(`${base()}/p/diario/${id}`,JSON.stringify({t,a,c:COLORE}));
    const m=store.get(mieiKey(),[]);m.push({id,t,c:COLORE});store.set(mieiKey(),m);renderBoard();$("pm").textContent="Attaccato! Potete aggiungerne altri.";};
}
$("body").addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;const id=b.dataset.rm;
  if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Togli?";b.style.fontSize="14px";setTimeout(()=>{if(b.isConnected){delete b.dataset.sure;b.textContent="×";b.style.fontSize=""}},3000);return}
  pub(`${base()}/p/diario/${id}`,"");store.set(mieiKey(),store.get(mieiKey(),[]).filter(p=>p.id!==id));renderBoard()});

/* la domanda arriva dalla LIM: è un dato di chiunque conosca la sala, quindi si controlla */
function onMsg(topic,buf){
  if(topic!==base()+"/poll")return;let d=null;const txt=String(buf||""),prev=POLL;
  if(txt){try{d=JSON.parse(txt)}catch(e){return}}
  if(!d||typeof d!=="object"){POLL=null}
  else if(!d.id){POLL={id:null,form:okForm(d.form)?d.form:null,board:d.board&&d.board.id==="diario"?{id:"diario",q:"Mi servirebbe qualcosa che…"}:null}}
  else if(typeof d.id==="string"&&/^[a-z0-9-]{1,40}$/.test(d.id)&&typeof d.q==="string"&&Array.isArray(d.o)){
    POLL={id:d.id,r:Number.isInteger(d.r)&&d.r>=0?d.r:0,q:d.q.slice(0,300),o:d.o.slice(0,8).map(t=>String(t).slice(0,80)),c:(Array.isArray(d.c)?d.c:[]).slice(0,8).map(n=>Math.max(0,Math.floor(+n)||0))}}
  if(POLL&&POLL.board&&document.getElementById("pt")&&prev&&prev.board)return;
  render();
}
function connect(){
  CLIENTS.forEach(c=>{try{c.end(true)}catch(e){}});CLIENTS=[];POLL=null;status();render();
  if(!/^[a-z0-9]{6}$/.test(SALA))return;
  if(typeof mqtt==="undefined"){$("sttxt").textContent="Senza rete";return}
  BROKERS.forEach(url=>{let c;try{c=mqtt.connect(url,{clientId:"tel-"+rnd(8),reconnectPeriod:4000,connectTimeout:8000,clean:true,
      will:{topic:`${base()}/here/${ME}`,payload:"",retain:true,qos:0}})}catch(e){return}
    CLIENTS.push(c);
    c.on("connect",()=>{c.subscribe(base()+"/poll");c.publish(`${base()}/here/${ME}`,"1",{retain:true,qos:0});status()});
    c.on("close",status);c.on("error",()=>{});c.on("message",onMsg)});
}
addEventListener("hashchange",()=>{SALA=(location.hash.slice(1)||"").toLowerCase();connect()});
addEventListener("pagehide",()=>pub(`${base()}/here/${ME}`,""));
connect();
</script>
