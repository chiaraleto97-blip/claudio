<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Firma · IDEAᴵᴬ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,400;1,9..144,600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Il registro presenze dal telefono: il corsista scrive nome e cognome e firma con il dito su un foglio di carta chiara, sul solito cielo notturno. La firma va nel Foglio Google di chi conduce il corso. */
:root{
  --bg:#17142C; --panel:rgba(38,30,64,.82); --ink:#F3EAF0; --muted:#B9A9C4; --line:#3B3056;
  --paper:#FFFDF8; --paper-ink:#1E1830; --paper-line:#CFC4D6;
  --rosso:#EA9B8C; --giallo:#F2B97F; --verde:#88C0AF; --glow:#F6D58E; --giallo-d:#8A5217;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-serif:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:linear-gradient(to bottom,#14122A 0%,#1F1A3C 40%,#35284F 75%,#5C3760 100%) fixed,var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding-block:max(18px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--giallo);outline-offset:3px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.logo sup{font-size:.45em;color:var(--rosso)}
.eyebrow{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--giallo);margin:0}
h1{font-family:var(--f-serif);font-weight:500;font-size:32px;line-height:1.1;margin:4px 0 0}
h1 em{font-style:italic;font-weight:400;color:var(--glow)}
.panel{background:var(--panel);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
input[type=text]{width:100%;background:rgba(255,255,255,.08);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-family:var(--f-body);font-size:19px;letter-spacing:0;text-transform:none}
input:focus{border-color:var(--giallo);outline:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select{font:inherit;background:rgba(255,255,255,.08);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:9px 12px}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 16px;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glow);color:#2A2045}
canvas{display:block;width:100%;aspect-ratio:2.4/1;border-radius:16px;touch-action:none;cursor:crosshair;box-shadow:0 0 0 3px var(--glow);
  background:linear-gradient(transparent 72%,#CFC4D6 72%,#CFC4D6 73%,transparent 73%),var(--paper)}
.btn{border:0;border-radius:16px;padding:14px 22px;font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;background:var(--giallo);color:#2A2045;box-shadow:0 5px 0 var(--giallo-d)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.line{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.msg{margin:0;font-size:16px;color:var(--muted)}
.msg.err{color:var(--rosso)}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 10px}
.done .ok{width:84px;height:84px;border-radius:50%;background:var(--verde);display:grid;place-items:center;color:#17142C;font-size:46px;font-weight:800;box-shadow:0 0 40px -6px var(--verde)}
.done img{max-width:260px;background:var(--paper);border-radius:12px;padding:6px 10px}
.note{font-size:14px;color:var(--muted);margin:0}
/* logo Wolf Team, nei colori del corso */
.wt{display:inline-flex;align-items:center;gap:.5em;font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap;vertical-align:middle;line-height:1;font-style:normal;font-size:12px}
.wt .wt-m{width:2.1em;height:2.1em;flex:none;display:block}
.wt-w b{font-weight:800;color:var(--wt-accent,#F2B97F)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <div class="top"><span class="logo">IDEA<sup>IA</sup></span><span class="wt"><svg class="wt-m" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="93" style="fill:#ABA3DC;stroke:#F6D58E;stroke-width:7"/><circle cx="100" cy="100" r="84" style="fill:none;stroke:#F7F1EE;stroke-opacity:.28;stroke-width:2"/><path d="M53 40.9 74.8 64.3 49.7 72.7Z" style="fill:#F7F1EE"/><path d="M146.9 40.9 125.2 64.3 150.3 72.7Z" style="fill:#F7F1EE"/><path d="M100 57.6 116.8 62.6 160.3 89.4 180.5 116.1 133.5 143.1 100 176.6Z" style="fill:#F7F1EE;opacity:.5"/><path d="M61.5 96.2 88.2 101.2 76.5 109.5Z" style="fill:#17142C"/><path d="M138.5 96.2 111.8 101.2 123.5 109.5Z" style="fill:#17142C"/><path d="M88.2 153.1 111.8 153.1 100 168.1Z" style="fill:#17142C"/></svg><span class="wt-w">Wolf <b>Team</b></span></span></div>
  <div><p class="eyebrow">Registro presenze</p><h1>Firma <em>qui</em></h1></div>

  <div id="bad" class="panel" hidden><p class="msg err">Questo link non è completo. Inquadrate di nuovo il QR sulla LIM.</p></div>

  <form id="form" class="panel" autocomplete="on" hidden>
    <div class="row">
      <select id="inc" aria-label="Incontro"><option value="1">Incontro 1</option><option value="2">Incontro 2</option><option value="3">Incontro 3</option><option value="4">Incontro 4</option><option value="5">Incontro 5</option></select>
      <div class="seg" role="group" aria-label="Momento"><button type="button" id="m-e" aria-pressed="true">Entrata</button><button type="button" id="m-u" aria-pressed="false">Uscita</button></div>
    </div>
    <label class="f" for="nome">Nome e cognome<input type="text" id="nome" name="name" autocomplete="name" maxlength="80" placeholder="Anna Rossi" required></label>
    <div>
      <p class="msg" style="margin-bottom:8px">Firmate con il dito sopra la riga:</p>
      <canvas id="c" width="1200" height="500" aria-label="Spazio per la firma"></canvas>
    </div>
    <div class="row" style="justify-content:space-between"><button type="button" class="btn line" id="clear">Cancella</button><button type="submit" class="btn" id="send" disabled>Invia la firma</button></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <p class="note">La firma va nel registro presenze del corso, un Foglio Google di chi conduce la formazione, e compare sul foglio firme stampato.</p>
  </form>

  <div id="done" class="panel done" hidden aria-live="polite">
    <div class="ok" aria-hidden="true">✓</div>
    <h1 style="font-size:28px">Firma ricevuta</h1>
    <p class="msg" id="done-txt"></p>
    <img id="done-img" alt="La vostra firma">
    <button type="button" class="btn line" id="again">Firma di nuovo</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* dal QR: #s=<app web>&c=<codice del corso>&i=<incontro>&m=<e|u> */
const Q=Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const OK=/^[A-Za-z0-9_-]{20,120}$/.test(Q.s||"")&&/^[a-z0-9]{4,12}$/.test(Q.c||"");
const URL_APP=OK?`https://script.google.com/macros/s/${Q.s}/exec`:"";
let MODO=Q.m==="u"?"u":"e",drawn=false,last=null;
if(!OK){$("bad").hidden=false}else{$("form").hidden=false}
if(/^[1-5]$/.test(Q.i||""))$("inc").value=Q.i;
const setModo=m=>{MODO=m;$("m-e").setAttribute("aria-pressed",m==="e");$("m-u").setAttribute("aria-pressed",m==="u")};
setModo(MODO);$("m-e").onclick=()=>setModo("e");$("m-u").onclick=()=>setModo("u");
$("nome").value=store.get("firma-nome","");

const cv=$("c"),cx=cv.getContext("2d");
const ready=()=>{$("send").disabled=!(drawn&&$("nome").value.trim().length>=3)};
$("nome").addEventListener("input",ready);
const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.addEventListener("pointerdown",e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);last=pt(e);cx.lineWidth=8;cx.lineCap="round";cx.lineJoin="round";cx.strokeStyle=cx.fillStyle="#1E1830";cx.beginPath();cx.arc(last[0],last[1],4,0,7);cx.fill()});
cv.addEventListener("pointermove",e=>{if(!last)return;const p=pt(e);cx.beginPath();cx.moveTo(last[0],last[1]);cx.lineTo(p[0],p[1]);cx.stroke();last=p;if(!drawn){drawn=true;ready()}});
["pointerup","pointercancel","pointerleave"].forEach(ev=>cv.addEventListener(ev,()=>{last=null}));
$("clear").onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);drawn=false;ready()};

/* ritaglia il tratto e lo rimpicciolisce: un'immagine leggera, che sta in una cella del Foglio */
function trimmed(){const d=cx.getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=0,y1=0;
  for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2)if(d[(y*cv.width+x)*4+3]>20){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<=x0||y1<=y0)return null;x0=Math.max(0,x0-14);y0=Math.max(0,y0-14);x1=Math.min(cv.width,x1+14);y1=Math.min(cv.height,y1+14);
  let k=Math.min(1,150/(y1-y0),480/(x1-x0)),url="";
  for(let i=0;i<4;i++){const o=document.createElement("canvas");o.width=Math.max(1,Math.round((x1-x0)*k));o.height=Math.max(1,Math.round((y1-y0)*k));
    o.getContext("2d").drawImage(cv,x0,y0,x1-x0,y1-y0,0,0,o.width,o.height);url=o.toDataURL("image/png");if(url.length<40000)break;k*=.7}
  return url}

$("form").addEventListener("submit",async e=>{e.preventDefault();if(!OK||!drawn)return;
  const nome=$("nome").value.trim().replace(/\s+/g," "),firma=trimmed();if(nome.length<3||!firma)return;
  store.set("firma-nome",nome);$("send").disabled=true;$("msg").className="msg";$("msg").textContent="Invio in corso…";
  try{const r=await fetch(URL_APP,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({tipo:"firma",codice:Q.c,incontro:+$("inc").value,momento:MODO,nome,firma})});
    const d=await r.json();if(!d.ok)throw new Error(d.errore||"risposta");
    $("form").hidden=true;$("done").hidden=false;$("done-img").src=firma;
    $("done-txt").textContent=`Grazie, ${nome}. Incontro ${$("inc").value}, ${MODO==="e"?"entrata":"uscita"}.`}
  catch(err){$("msg").className="msg err";$("msg").textContent="La firma non è arrivata. Controllate la connessione e riprovate.";ready()}
});
$("again").onclick=()=>{$("done").hidden=true;$("form").hidden=false;cx.clearRect(0,0,cv.width,cv.height);drawn=false;$("msg").textContent="";ready()};
</script>
